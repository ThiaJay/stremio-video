name: Night Audio DSP acceptance
on:
  push:
    branches:
      - feature/night-audio-contract-20261012
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dsp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install isolated player and DSP tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mpv ffmpeg
      - name: Verify real MPV filter transport and synthetic dynamic range reduction
        run: node tests/night-audio-mpv-smoke.cjs
