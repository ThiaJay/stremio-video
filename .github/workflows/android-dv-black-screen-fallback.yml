name: Build Android DV black-screen recovery APK

on:
  push:
    branches:
      - fix/android-dv-black-screen-fallback
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-dvfix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/dvfix-test.keystore
      ANDROID_KEYSTORE_PASSWORD: dvfix-test-only
      ANDROID_KEY_ALIAS: dvfix
      ANDROID_KEY_PASSWORD: dvfix-test-only

    steps:
      - name: Checkout patch source
        uses: actions/checkout@v4
        with:
          ref: fix/android-dv-black-screen-fallback
          path: patch-source

      - name: Checkout pinned Stremio Android source
        uses: actions/checkout@v4
        with:
          repository: stremio-native/stremio-android
          ref: 4bdef3b6be1186d9aa22acd8b3ec391c22f0e083
          submodules: recursive
          path: android

      - name: Prepare stable DV Fix signing key
        shell: bash
        run: |
          base64 -d patch-source/android-dvfix/dvfix-test.keystore.b64 > android/dvfix-test.keystore
          test -s android/dvfix-test.keystore
          keytool -list -keystore android/dvfix-test.keystore -storepass dvfix-test-only -alias dvfix >/dev/null

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
          command -v sdkmanager || true

      - name: Install Android 36 platform
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "platform-tools"

      - name: Inject matching upstream stream server JNI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream-jni android/app/src/main/jniLibs/armeabi-v7a android/app/src/main/jniLibs/arm64-v8a

          curl -fL --retry 3 --retry-delay 2             -o upstream-jni/StremioMobile-v1.2.4-armeabi-v7a-release.apk             https://github.com/stremio-native/stremio-android/releases/download/v1.2.4/StremioMobile-v1.2.4-armeabi-v7a-release.apk

          curl -fL --retry 3 --retry-delay 2             -o upstream-jni/StremioMobile-v1.2.4-arm64-v8a-release.apk             https://github.com/stremio-native/stremio-android/releases/download/v1.2.4/StremioMobile-v1.2.4-arm64-v8a-release.apk

          echo "519ab54a8a57e93c5a2f2a70cced18673063cffcb88cfdcd0ec6c9a7e5f5570e  upstream-jni/StremioMobile-v1.2.4-armeabi-v7a-release.apk" | sha256sum -c -
          echo "3ffd96e6c6f0b23845f7ee6ab721d52ba1534055304959ed84c9589aac8bc97e  upstream-jni/StremioMobile-v1.2.4-arm64-v8a-release.apk" | sha256sum -c -

          unzip -p upstream-jni/StremioMobile-v1.2.4-armeabi-v7a-release.apk             lib/armeabi-v7a/libstream_server.so             > android/app/src/main/jniLibs/armeabi-v7a/libstream_server.so

          unzip -p upstream-jni/StremioMobile-v1.2.4-arm64-v8a-release.apk             lib/arm64-v8a/libstream_server.so             > android/app/src/main/jniLibs/arm64-v8a/libstream_server.so

          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path("android/app/src/main/jniLibs/armeabi-v7a/libstream_server.so"),
              Path("android/app/src/main/jniLibs/arm64-v8a/libstream_server.so"),
          ]
          for path in paths:
              data = path.read_bytes()
              old = b"http://127.0.0.1:11470"
              new = b"http://127.0.0.1:11471"
              count = data.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one upstream 11470 endpoint, found {count}")
              data = data.replace(old, new)
              if b"11470" in data:
                  raise SystemExit(f"{path}: native 11470 reference remains after patch")
              if data.count(new) != 1:
                  raise SystemExit(f"{path}: patched 11471 endpoint verification failed")
              path.write_bytes(data)
              print(f"patched native streaming endpoint in {path}")
          PY

          test -s android/app/src/main/jniLibs/armeabi-v7a/libstream_server.so
          test -s android/app/src/main/jniLibs/arm64-v8a/libstream_server.so
          ! grep -a -q '11470' android/app/src/main/jniLibs/armeabi-v7a/libstream_server.so
          ! grep -a -q '11470' android/app/src/main/jniLibs/arm64-v8a/libstream_server.so
          grep -a -q 'http://127.0.0.1:11471' android/app/src/main/jniLibs/armeabi-v7a/libstream_server.so
          grep -a -q 'http://127.0.0.1:11471' android/app/src/main/jniLibs/arm64-v8a/libstream_server.so
          file android/app/src/main/jniLibs/armeabi-v7a/libstream_server.so
          file android/app/src/main/jniLibs/arm64-v8a/libstream_server.so

      - name: Apply side-by-side playback recovery
        run: python3 patch-source/android-dvfix/apply_patch.py android

      - name: Verify patch footprint
        shell: bash
        run: |
          grep -q 'applicationId = "com.stremio.dvfix"' android/app/build.gradle.kts
          grep -q 'val supportedAbis = listOf("armeabi-v7a", "arm64-v8a")' android/app/build.gradle.kts
          test -s android/app/src/main/jniLibs/armeabi-v7a/libstream_server.so
          test -s android/app/src/main/jniLibs/arm64-v8a/libstream_server.so
          grep -q 'videoFramePresent' android/app/src/main/java/com/stremio/mobile/player/Player.kt
          grep -q 'onRenderedFirstFrame' android/app/src/main/java/com/stremio/mobile/player/ExoStreamPlayer.kt
          grep -q 'recoverSameSourceToMpv' android/app/src/main/java/com/stremio/mobile/player/PlaybackManager.kt
          grep -q '11471' android/app/src/main/java/com/stremio/mobile/server/JniStreamingServerController.kt
          grep -q 'DV_FIX_BASE_URL = "http://127.0.0.1:11471"' android/app/src/main/java/com/stremio/mobile/server/JniStreamingServerController.kt
          grep -q 'Reusing already-running DV Fix streaming server' android/app/src/main/java/com/stremio/mobile/server/JniStreamingServerController.kt
          grep -q 'suppressing duplicate-bind failure' android/app/src/main/java/com/stremio/mobile/server/JniStreamingServerController.kt
          grep -q '127.0.0.1:11471' android/app/src/main/java/com/stremio/mobile/core/StremioCore.kt
          grep -q '127.0.0.1:11471' android/app/src/main/java/com/stremio/mobile/presentation/screens/PlayerScreen.kt
          grep -q 'Stremio DV Fix' android/app/src/main/res/values/strings.xml
          grep -q 'mutableStateOf(AuthScreen.Login)' android/app/src/main/java/com/stremio/mobile/presentation/screens/AuthFlow.kt
          grep -q 'focusRequester(emailFocusRequester)' android/app/src/main/java/com/stremio/mobile/presentation/screens/AuthFlow.kt
          grep -q 'MutableStateFlow(false)' android/app/src/main/java/com/stremio/mobile/presentation/viewmodel/MainViewModel.kt
          grep -q 'Upstream self-update is intentionally disabled' android/app/src/main/java/com/stremio/mobile/presentation/viewmodel/MainViewModel.kt
          ! grep -q 'leakcanary-android' android/app/build.gradle.kts

      - name: Run Android unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build universal debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Collect Fire TV APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find android/app/build/outputs/apk/debug -type f -name '*universal*debug*.apk' | head -n 1)"
          if [ -z "$apk" ]; then
            apk="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          fi
          test -n "$apk"
          cp "$apk" dist/STREMIO_DV_FIX_FIRETV_DEBUG.apk

          python3 - <<'PY'
          import zipfile
          apk = 'dist/STREMIO_DV_FIX_FIRETV_DEBUG.apk'
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              required = {
                  'lib/armeabi-v7a/libstream_server.so',
                  'lib/arm64-v8a/libstream_server.so',
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'Missing stream server JNI in final APK: {missing}')
              for name in sorted(required):
                  info = z.getinfo(name)
                  if info.file_size <= 0:
                      raise SystemExit(f'Empty stream server JNI: {name}')
                  data = z.read(name)
                  if b'11470' in data:
                      raise SystemExit(f'Native port 11470 remains in final APK: {name}')
                  if b'http://127.0.0.1:11471' not in data:
                      raise SystemExit(f'Native port 11471 endpoint missing in final APK: {name}')
                  print(name, info.file_size, 'native port 11471 verified')
          PY

          sha256sum dist/STREMIO_DV_FIX_FIRETV_DEBUG.apk | tee dist/SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stremio-dv-fix-universal-debug
          path: dist/*
          if-no-files-found: error
          retention-days: 14
