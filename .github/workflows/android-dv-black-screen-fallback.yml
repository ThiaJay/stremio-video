name: Build Android DV black-screen recovery APK

on:
  push:
    branches:
      - fix/android-dv-black-screen-fallback
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-dvfix:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout patch source
        uses: actions/checkout@v4
        with:
          ref: fix/android-dv-black-screen-fallback
          path: patch-source

      - name: Checkout pinned Stremio Android source
        uses: actions/checkout@v4
        with:
          repository: stremio-native/stremio-android
          ref: 4bdef3b6be1186d9aa22acd8b3ec391c22f0e083
          submodules: recursive
          path: android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
          command -v sdkmanager || true

      - name: Install Android 36 platform
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "platform-tools"

      - name: Apply side-by-side playback recovery
        run: python3 patch-source/android-dvfix/apply_patch.py android

      - name: Verify patch footprint
        shell: bash
        run: |
          grep -q 'applicationId = "com.stremio.dvfix"' android/app/build.gradle.kts
          grep -q 'videoFramePresent' android/app/src/main/java/com/stremio/mobile/player/Player.kt
          grep -q 'onRenderedFirstFrame' android/app/src/main/java/com/stremio/mobile/player/ExoStreamPlayer.kt
          grep -q 'recoverSameSourceToMpv' android/app/src/main/java/com/stremio/mobile/player/PlaybackManager.kt
          grep -q '11471' android/app/src/main/java/com/stremio/mobile/server/JniStreamingServerController.kt
          grep -q '127.0.0.1:11471' android/app/src/main/java/com/stremio/mobile/core/StremioCore.kt
          grep -q '127.0.0.1:11471' android/app/src/main/java/com/stremio/mobile/presentation/screens/PlayerScreen.kt
          grep -q 'Stremio DV Fix' android/app/src/main/res/values/strings.xml

      - name: Run Android unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build universal debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Collect universal APK
        shell: bash
        run: |
          mkdir -p dist
          apk="$(find android/app/build/outputs/apk/debug -type f -name '*universal*debug*.apk' | head -n 1)"
          if [ -z "$apk" ]; then
            apk="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          fi
          test -n "$apk"
          cp "$apk" dist/STREMIO_DV_FIX_UNIVERSAL_DEBUG.apk
          sha256sum dist/STREMIO_DV_FIX_UNIVERSAL_DEBUG.apk | tee dist/SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stremio-dv-fix-universal-debug
          path: dist/*
          if-no-files-found: error
          retention-days: 14
