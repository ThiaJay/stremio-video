name: Lint

on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Set up Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Install NPM dependencies without install scripts
      run: npm install --ignore-scripts --no-package-lock --no-fund --no-audit
    - name: Lint
      run: npm run lint
    - name: Test MPV session and WebOS subtitle safety
      run: npm test
    - name: Verify candidate package contents without publishing
      run: npm pack --dry-run --json > package-inventory.json
