name: Isolated Fire TV companion Media3 build
on:
  push:
    branches:
      - feature/stremio-companion-tv-20261012
    paths:
      - 'android-night-audio-reference/**'
      - '.github/workflows/native-tv-companion-validation.yml'
  pull_request:
    paths:
      - 'android-night-audio-reference/**'
      - '.github/workflows/native-tv-companion-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.11.1'
      - name: Install only required Android SDK components
        run: sdkmanager --install 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0' >/dev/null
      - name: Verify tested bridge source still matches original reference
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '0e067446053abc456196d060bc96dff72d03902542fb9ae97cefd47fa143f23b  android-night-audio-reference/companion-tv/src/main/java/org/pss/stremio/tv/NativeTvBridge.kt' | sha256sum -c -
      - name: Validate exact source contract and safety guard
        run: python3 android-night-audio-reference/companion-tv/tools/check_source.py
      - name: Compile and run original + extended JVM test suite, then build Android APK
        run: |
          gradle -p android-night-audio-reference \
            :processor:testDebugUnitTest \
            :companion-tv:compileDebugKotlin \
            :companion-tv:testDebugUnitTest \
            :companion-tv:assembleDebug \
            --no-daemon --stacktrace
      - name: Run Android companion lint without suppressing errors
        run: gradle -p android-night-audio-reference :companion-tv:lintDebug --no-daemon
      - name: Verify JVM test suite genuinely executed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('android-night-audio-reference/companion-tv/build/test-results/testDebugUnitTest')
          docs=list(root.glob('TEST-*.xml'))
          assert docs, 'No unit test result files produced'
          tests=failures=errors=0
          names=[]
          for file in docs:
              tree=ET.parse(file).getroot()
              tests+=int(tree.get('tests',0))
              failures+=int(tree.get('failures',0))
              errors+=int(tree.get('errors',0))
              names += [node.get('name','') for node in tree.findall('.//testcase')]
          assert tests>=17 and failures==0 and errors==0, (tests,failures,errors)
          assert 'retainedBridgeAllFiftyThreeAssertions' in names, 'Original Kotlin bridge regression not run'
          assert 'localWavHasCorrectPcmHeaderAndDurationAndIsIdempotent' in names, 'Synthetic media test not run'
          assert 'individualEpisodeRequiresRealCanonicalSourceAndRemoteConfirmation' in names, 'Individual episode Core action not tested'
          assert 'secondVideoReadMustNotChangeEvenWhenIdentityIsStable' in names, 'Episode metadata race regression not executed'
          assert 'dispatchedPayloadIsDeepDetachedFromMutableCoreObject' in names, 'Deep snapshot regression not executed'
          assert 'finalSeekLeaseRejectsMediaSwitchAfterCoreAcknowledgement' in names, 'Seek race regression not executed'
          assert 'latePlaybackOrNextEpisodePopupCannotSeekBackwards' in names, 'Late segment rewind regression not executed' 
          print('Verified Android TV JVM tests:',tests,'failures:',failures,'errors:',errors)
          PY
      - name: Enforce compile-only official Core SDK and no account/API writes
        run: python3 android-night-audio-reference/core-interop/tools/check_core_compat.py
      - name: Compile official Stremio Core read-only ABI and run isolated JVM tests
        run: |
          gradle -p android-night-audio-reference \
            :core-interop:compileDebugKotlin \
            :core-interop:testDebugUnitTest \
            --no-daemon --stacktrace
      - name: Require all read-only native Core session guards to execute
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('android-night-audio-reference/core-interop/build/test-results/testDebugUnitTest')
          reports=list(root.glob('TEST-*.xml'))
          assert reports, 'Read-only Core ABI JUnit results absent'
          count=errors=failures=0
          names=[]
          for report in reports:
              tree=ET.parse(report).getroot()
              count+=int(tree.get('tests','0'))
              errors+=int(tree.get('errors','0'))
              failures+=int(tree.get('failures','0'))
              names += [testcase.get('name','') for testcase in tree.findall('.//testcase')]
          assert count>=8 and not errors and not failures,(count,errors,failures)
          for required in ('accountSwitchOrEpochChangeFailsClosed',
                           'newVideoWithSameMetadataFailsClosed',
                           'noPlayableUrlIsInferredFromObservedProviderLists'):
              assert required in names, 'Core safety test missing: '+required
          print('Verified isolated official Core Kotlin interop JUnit:',count,'failures:',failures)
          PY
      - name: Verify standalone package and no permissions or forbidden automatic source intake
        shell: bash
        run: |
          set -euo pipefail
          apk=android-night-audio-reference/companion-tv/build/outputs/apk/debug/companion-tv-debug.apk
          test -s "$apk"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$aapt" dump badging "$apk" | grep -F "package: name='org.thiajay.stremiotvcompanion'"
          "$aapt" dump badging "$apk" | grep -F "sdkVersion:'26'"
          "$aapt" dump permissions "$apk" > /tmp/companion-permissions.txt
          if grep -E 'uses-permission:' /tmp/companion-permissions.txt; then
            echo 'Unreviewed Android permission. Refusing admission.'
            exit 1
          fi
          if "$aapt" dump xmltree "$apk" AndroidManifest.xml | grep -Fq 'android.intent.action.VIEW'; then
            echo 'External playback intent unexpectedly exposed in offline-only candidate.'
            exit 1
          fi
          unzip -t "$apk" >/dev/null
          sha256sum "$apk"
          echo 'Android companion source and debug APK built; no upload, release, device or account action performed.'
# Never upload debug APK, release assets, credentials, private data or the synthetic sample.
