name: Isolated Fire TV companion Media3 build
on:
  push:
    branches:
      - feature/stremio-companion-tv-20261012
    paths:
      - 'android-night-audio-reference/**'
      - '.github/workflows/native-tv-companion-validation.yml'
  pull_request:
    paths:
      - 'android-night-audio-reference/**'
      - '.github/workflows/native-tv-companion-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.11.1'
      - name: Install only required Android SDK components
        run: sdkmanager --install 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0' >/dev/null
      - name: Verify tested bridge source matches accepted Season 0-safe contract
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '789e29b997b503ee6cac03d638a7da023ecef551c866fbafe36287ce36862715  android-night-audio-reference/companion-tv/src/main/java/org/pss/stremio/tv/NativeTvBridge.kt' | sha256sum -c -
      - name: Validate exact source contract and safety guard
        run: python3 android-night-audio-reference/companion-tv/tools/check_source.py
      - name: Compile and run original + extended JVM test suite, then build Android APK
        run: |
          gradle -p android-night-audio-reference \
            :processor:testDebugUnitTest \
            :companion-tv:compileDebugKotlin \
            :companion-tv:testDebugUnitTest \
            :companion-tv:assembleDebug \
            --no-daemon --stacktrace
      - name: Run Android companion lint without suppressing errors
        run: gradle -p android-night-audio-reference :companion-tv:lintDebug --no-daemon
      - name: Verify JVM test suite genuinely executed
        shell: bash
        run: |
          python3 - <<'PY'
