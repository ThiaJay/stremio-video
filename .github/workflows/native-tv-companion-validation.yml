            :core-interop:testDebugUnitTest \
            --no-daemon --stacktrace
      - name: Require all read-only native Core session guards to execute
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('android-night-audio-reference/core-interop/build/test-results/testDebugUnitTest')
          reports=list(root.glob('TEST-*.xml'))
          assert reports, 'Read-only Core ABI JUnit results absent'
          count=errors=failures=0
          names=[]
          for report in reports:
              tree=ET.parse(report).getroot()
              count+=int(tree.get('tests','0'))
              errors+=int(tree.get('errors','0'))
              failures+=int(tree.get('failures','0'))
              names += [testcase.get('name','') for testcase in tree.findall('.//testcase')]
          assert count>=8 and not errors and not failures,(count,errors,failures)
          for required in ('accountSwitchOrEpochChangeFailsClosed',
                           'newVideoWithSameMetadataFailsClosed',
                           'noPlayableUrlIsInferredFromObservedProviderLists'):
              assert required in names, 'Core safety test missing: '+required
          print('Verified isolated official Core Kotlin interop JUnit:',count,'failures:',failures)
          PY
      - name: Verify standalone package and no permissions or forbidden automatic source intake
        shell: bash
        run: |
          set -euo pipefail
          apk=android-night-audio-reference/companion-tv/build/outputs/apk/debug/companion-tv-debug.apk
          test -s "$apk"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$aapt" dump badging "$apk" > /tmp/companion-badging.txt
          grep -F "package: name='org.thiajay.stremiotvcompanion'" /tmp/companion-badging.txt
          grep -F "sdkVersion:'26'" /tmp/companion-badging.txt
          grep -F "launchable-activity: name='org.thiajay.stremiotvcompanion.MobileStoryOrderLabActivity'" /tmp/companion-badging.txt
          "$aapt" dump xmltree "$apk" AndroidManifest.xml > /tmp/companion-manifest-tree.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          lines=Path('/tmp/companion-manifest-tree.txt').read_text().splitlines()
          matches=[i for i,line in enumerate(lines) if '"android.software.leanback"' in line]
          assert len(matches)==1, ('leanback_feature_count',len(matches))
          i=matches[0]
          block='\n'.join(lines[max(0,i-2):min(len(lines),i+5)])
          assert re.search(r'android:required.*(?:0x0|false)',block), block
          print('Verified packaged Leanback feature is optional')
          PY
          "$aapt" dump permissions "$apk" > /tmp/companion-permissions.txt
          if grep -E 'uses-permission:' /tmp/companion-permissions.txt; then
            echo 'Unreviewed Android permission. Refusing admission.'
            exit 1
          fi
          if grep -Fq 'android.intent.action.VIEW' /tmp/companion-manifest-tree.txt; then
            echo 'External playback intent unexpectedly exposed in offline-only candidate.'
            exit 1
          fi
          unzip -t "$apk" >/dev/null
          sha256sum "$apk"
          echo 'Android companion source and debug APK built; no upload, release, device or account action performed.'
# Never upload debug APK, release assets, credentials, private data or the synthetic sample.

